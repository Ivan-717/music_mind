server:
  port: 8080

spring:
  application:
    name: musicmind-backend
  config:
    # 复用 Python 侧那份 .env（仓库根目录）。
    # 这里刻意不加 optional: ，文件找不到就启动失败 —— 否则密码会静默变成
    # 空字符串，你只会在 MySQL 那边收到一个没头没尾的 Access denied。
    import: file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:musicmind}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

musicbrainz:
  # User-Agent 来自 .env（上面 config.import 已把它读进来）。
  # MusicBrainz 要求 UA 里带联系方式，给空值会被限流甚至封禁。
  user-agent: ${MUSICBRAINZ_USER_AGENT:MusicMind/1.0 (unknown@example.com)}
  base-url: https://musicbrainz.org/ws/2

# 按需入库（③）。路径都相对 backend/——和上面 config.import 的 ../.env 同一套约定
ingestion:
  data-pipeline-dir: ../data-pipeline
  # 【必须指到 .venv 里的那个 python】系统 python 没装 requests / python-dotenv，
  # 用它起子进程会以 ModuleNotFoundError 失败，从 Java 这边只能看到一个非 0 退出码
  python: ../data-pipeline/.venv/Scripts/python.exe
  script: ingest_release.py
  # 单条任务的上限。超时强杀并按失败收尾，否则一个卡死的子进程能拖住整条队列
  job-timeout-seconds: 300
  poll-interval-ms: 1500
  # 子进程输出按 job id 落盘，失败时从文件尾部取原因。已在 .gitignore 里
  log-dir: ../logs/ingestion
  recent-jobs: 20

